<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>英単語 書き取り</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Source+Serif+4:wght@500;600&display=swap">
<style>
:root{
  --bg:#E9EDF3; --paper:#FBFCFE; --ink:#172033; --sub:#5B6577; --line:#CBD3DF; --rule:#DCE3EE;
  --accent:#2A4DB8; --accent-ink:#fff; --red:#C6352B; --green:#23795A; --tint-red:#FBEAE8; --tint-green:#E5F4EC; --amber:#9A5B00; --tint-amber:#FCF1DC;
  --jp:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
  --en:"Source Serif 4",Georgia,"Times New Roman",serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11141B; --paper:#1A1F2C; --ink:#E8ECF4; --sub:#9AA4B8; --line:#343C50; --rule:#262D3D;
    --accent:#8DA7FF; --accent-ink:#0F1424; --red:#FF8179; --green:#6FD0A0; --tint-red:#3A2123; --tint-green:#1B3128; --amber:#F2B450; --tint-amber:#3A2E17;
  }
}
:root[data-theme="dark"]{
  --bg:#11141B; --paper:#1A1F2C; --ink:#E8ECF4; --sub:#9AA4B8; --line:#343C50; --rule:#262D3D;
  --accent:#8DA7FF; --accent-ink:#0F1424; --red:#FF8179; --green:#6FD0A0; --tint-red:#3A2123; --tint-green:#1B3128; --amber:#F2B450; --tint-amber:#3A2E17;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--jp);line-height:1.7;-webkit-text-size-adjust:100%}
main{max-width:640px;margin:0 auto;padding:20px 16px 48px}
h1,h2,p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.paper{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:22px 20px}
.btn{border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:10px 16px;font-weight:500;min-height:44px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.btn.ghost{border-color:transparent;background:none;color:var(--sub)}
.btn:disabled{opacity:.45;cursor:default}

/* home */
.title{font-size:28px;font-weight:700;letter-spacing:.02em;margin:8px 0 2px}
.lead{color:var(--sub);margin-bottom:20px}
.prog{margin-bottom:16px}
.prog-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.prog-num{font-family:var(--en);font-size:30px;font-weight:600}
.prog-num small{font-family:var(--jp);font-size:14px;color:var(--sub);font-weight:400;margin-left:4px}
.meter{height:6px;background:var(--rule);border-radius:3px;overflow:hidden;margin-top:8px}
.meter i{display:block;height:100%;background:var(--green);transition:width .3s}
.field{margin-top:18px}
.field>label,.field>.lab{display:block;font-weight:700;margin-bottom:6px}
.range{display:flex;align-items:center;gap:10px}
.range input{width:100px}
input[type=number],select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;min-height:44px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:8px 14px;min-height:44px}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.check{display:flex;gap:10px;align-items:center;min-height:44px}
.check input{width:20px;height:20px;accent-color:var(--accent)}
.note{font-size:13px;color:var(--sub)}
.count{margin-top:6px}
.start{width:100%;margin-top:22px;font-size:18px;min-height:52px}

/* quiz */
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.topbar .pos{font-family:var(--en);font-size:18px}
.card{margin-top:14px;padding:26px 22px 22px;
  background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 35px,var(--rule) 35px,var(--rule) 36px);
  background-color:var(--paper)}
.no{font-size:13px;color:var(--sub)}
.meaning{font-size:clamp(24px,6vw,32px);font-weight:700;line-height:1.45;margin:6px 0 20px;min-height:2.9em}
.answer{width:100%;font-family:var(--en);font-size:30px;font-weight:500;background:transparent;color:var(--ink);border:0;border-bottom:3px solid var(--ink);border-radius:0;padding:6px 2px;letter-spacing:.02em}
.answer:focus{outline:none;border-bottom-color:var(--accent)}
.answer:disabled{opacity:1;-webkit-text-fill-color:currentColor}
.books{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.book{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:12px 12px 10px;min-height:44px}
.book[aria-checked=true]{border:2px solid var(--accent);padding:11px 11px 9px;background:var(--paper);box-shadow:inset 0 -4px 0 var(--accent)}
.book .bn{font-size:clamp(15px,4.4vw,20px);font-weight:700;line-height:1.3}
.book .bs{font-size:12px;color:var(--sub)}
.book .bl{font-size:13px;margin-top:6px}
.book .meter{width:100%;margin-top:6px}
.fb{min-height:96px;margin-top:14px}
.fb .verdict{font-weight:700;font-size:16px}
.fb .ok{color:var(--green)} .fb .ng{color:var(--red)}
.fb .typed{font-family:var(--en);font-size:22px;color:var(--red);margin-top:4px}
.fb .typed s{text-decoration-thickness:2px}
.fb .typed .wrong{background:var(--tint-red)}
.fb .correct{font-family:var(--en);font-size:34px;font-weight:600;color:var(--green);margin-top:2px;line-height:1.2}
.fb.good{background:var(--tint-green);border-radius:6px;padding:10px 12px}
.fb.bad{background:var(--tint-red);border-radius:6px;padding:10px 12px}
.actions{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.actions .primary{flex:1;min-width:140px}
.kbd{font-size:12px;color:var(--sub);margin-top:10px}

/* result */
.score{font-family:var(--en);font-size:56px;font-weight:600;line-height:1.1}
.score small{font-family:var(--jp);font-size:16px;color:var(--sub);font-weight:400}
.list{list-style:none;margin:12px 0 0;padding:0}
.list li{display:flex;gap:14px;padding:9px 0;border-top:1px solid var(--line);align-items:baseline}
.list b{font-family:var(--en);font-size:20px;min-width:7.5em;font-weight:600}
.list span{color:var(--sub);font-size:14px}
.stack{display:flex;flex-direction:column;gap:8px;margin-top:18px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.tabs{display:flex;gap:6px;position:relative;z-index:1;margin-bottom:-1px}
.tabs button{border:1px solid var(--line);border-bottom:0;background:var(--bg);border-radius:6px 6px 0 0;padding:10px 4px;flex:1;font-size:13px;min-height:44px;font-weight:500;color:var(--sub)}
.tabs button[aria-selected=true]{background:var(--paper);color:var(--ink);font-weight:700}
.panel{border-top-left-radius:0}
.plan-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}
.stat{border:1px solid var(--line);border-radius:6px;padding:10px 12px;background:var(--bg)}
.stat .k{display:block;font-size:13px;color:var(--sub)}
.stat .v{font-family:var(--en);font-size:32px;font-weight:600;line-height:1.25}
.stat .v small{font-family:var(--jp);font-size:14px;color:var(--sub);font-weight:400;margin-left:2px}
.stat .s{display:block;font-size:12px;color:var(--sub)}
.counts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
details.rules{margin-top:20px;border-top:1px solid var(--line);padding-top:6px}
details.rules summary{cursor:pointer;font-weight:700;min-height:44px;display:flex;align-items:center}
details.rules ul{margin:4px 0 0;padding-left:1.2em;font-size:14px;color:var(--sub)}
details.rules li{margin:6px 0}
.fb.hard{background:var(--tint-amber);border-radius:6px;padding:10px 12px}
.fb .hd{color:var(--amber)}
.fb .meta{font-weight:400;color:var(--sub);font-size:13px;margin-left:8px}
.fb .next{font-size:14px;color:var(--sub);margin-top:6px}
.tag{display:inline-block;font-size:12px;border:1px solid var(--line);border-radius:3px;padding:0 6px;margin-left:8px;color:var(--sub)}
@media (max-width:480px){.books{grid-template-columns:repeat(2,1fr)}}
.seg.dir{margin:0 0 12px}
.seg.dir button{flex:1;min-width:140px}
.eword{font-family:var(--en);font-size:clamp(30px,8vw,44px);font-weight:600;line-height:1.25;margin:10px 0 22px;min-height:2.5em;word-break:break-word}
.answer.ja{font-family:var(--jp);font-size:26px;font-weight:500}
.fb .correct.ja{font-family:var(--jp);font-size:24px;font-weight:700;line-height:1.5}
.fb .typed-ja{font-family:var(--jp);font-size:20px}
.aiset{margin:0 0 12px;border:1px solid var(--line);border-radius:6px;padding:0 12px;background:var(--paper)}
.aiset summary{cursor:pointer;font-weight:700;min-height:44px;display:flex;align-items:center}
.aiset label{display:block;font-size:13px;color:var(--sub);margin-top:8px}
.aiset input{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;min-height:44px}
.aiset .row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.aiset .note{margin:6px 0 10px}
.consent{margin:0 0 16px;border:2px solid var(--accent)}
.ctitle{font-size:18px;margin-bottom:6px}
.row2{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.sbar{display:flex;height:14px;border-radius:3px;overflow:hidden;background:var(--rule);margin-top:6px}
.sbar i{display:block;height:100%}
.thrgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:8px 0}
.thrf{display:block;font-size:13px;color:var(--sub)}
.thrf input{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;min-height:44px;margin-top:2px}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.gear{flex:none;width:46px;height:46px;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:50%;display:flex;align-items:center;justify-content:center;margin-top:6px}
.link{background:none;border:0;color:var(--accent);text-decoration:underline;padding:4px 2px;min-height:32px;cursor:pointer;font-size:inherit}
.overlay{position:fixed;inset:0;z-index:50;background:rgba(10,14,24,.55);overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(env(safe-area-inset-top,0px) + 12px) 12px calc(env(safe-area-inset-bottom,0px) + 12px)}
.overlay[hidden]{display:none}
.sheet{max-width:640px;margin:0 auto;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:16px 18px 20px}
.sheethead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.sheethead h2{font-size:20px}
.sset{border-top:1px solid var(--line);padding-top:12px;margin-top:18px}
.sset h3{font-size:16px;margin:0 0 6px}
.thrset{margin-top:4px}
.headr{display:flex;gap:8px;align-items:flex-start;flex:none}
.acct{height:46px;max-width:150px;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:23px;padding:0 14px;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:6px}
table.rank{border-collapse:collapse;width:100%}
table.rank th,table.rank td{border-bottom:1px solid var(--rule);padding:6px 8px;text-align:left}
table.rank td:last-child,table.rank th:last-child{text-align:right}
table.rank tr.me td{background:var(--tint-green);font-weight:700}
.scroll{overflow-x:auto}
</style>
</head>

    let p=pairs.get(pk);if(!p){p={u:L(e),first:e.t,firstG:e.g,n:0,reached:false,attemptsTo:null,done:false};pairs.set(pk,p)}
    p.n++;
    if(!p.reached&&((e.iv!=null&&e.iv>=CD)||e.dn===1)){p.reached=true;p.attemptsTo=p.n}
    if(e.dn===1)p.done=true;
    let u=users.get(L(e));if(!u){u={u:L(e),n:0,ok:0,pairs:0,reached:0};users.set(L(e),u)}
    u.n++;if(e.ok)u.ok++;
    if(e.k==='r'&&!e.lp&&e.gp!=null){for(const b of rt)if(e.gp>=b.lo&&e.gp<=b.hi){b.n++;if(e.ok)b.ok++;break}}
  }
  out.acc=s.length?okN/s.length:null;
  out.meanSecOk=mean(okSecs);out.medSecOk=median(okSecs);
  const att=[];
  for(const p of pairs.values()){
    out.pairs++;const u=users.get(p.u);u.pairs++;
    if(p.reached){out.reached++;u.reached++;att.push(p.attemptsTo)}
    if(p.done)out.done++;
    if((lastT.get(p.u)-p.first)>=CD*DAYMS){out.agedPairs++;if(p.reached)out.agedReached++}
    const f=out.byFirst[p.firstG]||(out.byFirst[p.firstG]={pairs:0,reached:0,att:[]});
    f.pairs++;if(p.reached){f.reached++;f.att.push(p.attemptsTo)}
  }
  for(const g in out.byFirst)out.byFirst[g].meanAtt=mean(out.byFirst[g].att);
  out.reachRate=out.pairs?out.reached/out.pairs:null;
  out.agedRate=out.agedPairs?out.agedReached/out.agedPairs:null;
  out.doneRate=out.pairs?out.done/out.pairs:null;
  out.meanAttempts=mean(att);out.medAttempts=median(att);
  out.retention=rt.map(b=>({label:b.label,n:b.n,ok:b.ok,rate:b.n?b.ok/b.n:null}));
  // 確認テスト
  const t=evs.filter(e=>e.m==='t'),ses=new Map(),ib=IVB.map(b=>({label:b[0],lo:b[1],hi:b[2],n:0,ok:0}));
  for(const e of t){
    const k=L(e)+'|'+(e.ss||'');let x=ses.get(k);if(!x){x={u:L(e),t:e.t,d:e.d,n:0,ok:0};ses.set(k,x)}
    x.n++;if(e.ok)x.ok++;if(e.t<x.t)x.t=e.t;
    if(e.iv!=null)for(const b of ib)if(e.iv>=b.lo&&e.iv<=b.hi){b.n++;if(e.ok)b.ok++;break}
    const wk=e.d+'|'+e.b+'|'+e.w,w=words.get(wk);if(w){w.nt++;if(e.ok)w.okt++}
  }
  const list=[...ses.values()].sort((a,b)=>a.t-b.t);
  out.tests={sessions:list.length,n:t.length,ok:t.filter(e=>e.ok).length,rate:t.length?t.filter(e=>e.ok).length/t.length:null,
    meanRate:list.length?mean(list.map(x=>x.ok/x.n)):null,list,byIv:ib.map(b=>({label:b.label,n:b.n,ok:b.ok,rate:b.n?b.ok/b.n:null}))};
  out.words=[...words.values()].map(w=>({d:w.d,b:w.b,w:w.w,n:w.n,ok:w.ok,acc:w.n?w.ok/w.n:null,meanSec:mean(w.secs),S:w.S,A:w.A,H:w.H,X:w.X,users:w.users.size,nt:w.nt,okt:w.okt}));
  out.users=[...users.values()].map(u=>({u:u.u,n:u.n,acc:u.n?u.ok/u.n:null,pairs:u.pairs,reachRate:u.pairs?u.reached/u.pairs:null}));
  return out;
}

const DEF_THR={je:{sb:1.5,sc:0.25,ab:3,ac:0.5},ej:{sb:3,sc:0.4,ab:5,ac:0.8}};
function thrCfg(){
  const d=DEF_THR[cfg.dir]||DEF_THR.je,c=(cfg.thr&&cfg.thr[cfg.dir])||{};
  const n=(v,x)=>(typeof v==='number'&&isFinite(v)&&v>=0&&v<=300)?v:x;
  return {sb:n(c.sb,d.sb),sc:n(c.sc,d.sc),ab:n(c.ab,d.ab),ac:n(c.ac,d.ac)};
}
function isCustomThr(){const t=thrCfg(),d=DEF_THR[cfg.dir]||DEF_THR.je;return t.sb!==d.sb||t.sc!==d.sc||t.ab!==d.ab||t.ac!==d.ac}
const jaLen=s=>Array.from(String(s||'').normalize('NFKC').replace(/\s/g,'')).length;   // 英語→日本語: 回答した日本語の文字数
function thresholds(v){const t=thrCfg(),L=typeof v==='number'?v:fold(v).length,S=t.sb+t.sc*L;return {S,A:Math.max(S,t.ab+t.ac*L)}}
function thrRulesText(){

}

/* ---------- 復習アルゴリズム ---------- */
function applySrs(e,g){
  const t=today(), key=e.key;
  e.requeue=0;
  const requeue=k=>{e.requeue=k;return `このセクション内で、あと${k}問ほど後にもう一度出ます`};
  const finish=()=>{e.done=true;S.doneCount++};
  const graduate=iv=>{
    const s=srs.words[key]||{r:0,l:0};
    s.r=1;s.iv=iv;s.last=t;s.due=t+iv;if(s.first===undefined)s.first=t;s.done=false;
    srs.words[key]=s;saveSrs();finish();
    return `次の復習: ${dayLabel(iv)}`;
  };
  if(e.kind==='rev'&&!e.loop){
    const s=srs.words[key];
    const elapsed=Math.max(1,t-(s.last===undefined?t:s.last));
    if(g==='X'){
      s.r=0;s.l=(s.l||0)+1;s.due=t;saveSrs();
      e.loop=true;e.cons=0;
      return '最初の学習からやり直しです。'+requeue(rnd(5,15));
    }
    if(g!=='H'&&elapsed>=30){
      s.done=true;s.r++;s.last=t;s.due=null;saveSrs();finish();S.mastered.push(e);
      return `完全定着(${elapsed}日ぶりに正解)。今後は出題されません`;
    }
    let iv;
    if(s.r<=1)iv=g==='S'?rnd(5,7):g==='A'?rnd(3,5):1;
    else iv=Math.max(1,Math.round(elapsed*({H:1,A:2,S:3}[g])));
    s.r++;s.iv=iv;s.last=t;s.due=t+iv;saveSrs();finish();
    return `次の復習: ${dayLabel(iv)}`;
  }
  if(e.kind==='new'&&!e.loop){
    if(g==='S')return graduate(rnd(5,10));
    if(g==='A')return graduate(1);
    e.loop=true;e.cons=0;
    return g==='H'?'まだ定着していません。'+requeue(rnd(28,32)):'まだ覚えていません。'+requeue(rnd(5,15));
  }
  // 学習ループ中(新規の2回目以降 / やり直し)
  if(g==='S'||g==='A'){e.cons++;if(e.cons>=2)return graduate(1);return (g==='S'?'定着。':'正解。')+'あと1回連続で正解すれば完了。'+requeue(rnd(8,12))}
  e.cons=0;
  return g==='H'?'まだ定着していません。'+requeue(rnd(28,32)):'まだ覚えていません。'+requeue(rnd(5,15));
}

/* ---------- 今日の計画 ---------- */
function planToday(){
  const t=today();
  const book=curBook();
  const dueAll=[];let newToday=0;
  for(const k in srs.words){
    const s=srs.words[k];
    if(s.first===t&&k.startsWith(book.id+'|'))newToday++;   // 新規の上限は単語帳ごと(日英/英日も別保存)
    if(!s.done&&s.due!==null&&s.due!==undefined&&s.due<=t&&INDEX.has(k)&&k.startsWith(book.id+'|'))dueAll.push({k,s});   // 復習は選択中の単語帳だけ
  }
  dueAll.sort((a,b)=>((a.s.r===0?0:1)-(b.s.r===0?0:1))||(a.s.due-b.s.due));
  const perBook={};   // 復習の上限も単語帳ごと(新規語数の5倍まで)
  const dueUse=dueAll.filter(x=>{const id=x.k.split('|')[0];perBook[id]=(perBook[id]||0)+1;return perBook[id]<=cfg.daily*5});
  const newLeft=Math.max(0,cfg.daily-newToday);
  const fresh=book.words.filter(w=>!srs.words[book.id+'|'+w[1]]);
  return {t,dueAll,dueUse,newToday,newLeft,fresh,newCount:Math.min(newLeft,fresh.length),book};
}
function startToday(){
  const p=planToday();
  const revs=shuffle(p.dueUse).map(({k,s})=>{const i=INDEX.get(k);return mkEntry(i.book,i.item,'rev',s.r===0)});
  let fr=cfg.newOrder==='random'?shuffle(p.fresh):p.fresh;
  const news=fr.slice(0,p.newCount).map(w=>mkEntry(p.book,w,'new',false));
  const queue=revs.concat(news);
  if(!queue.length){home();return}
  S={mode:'srs',queue,i:0,phase:'answer',answers:[],total:queue.length,doneCount:0,mastered:[],nRev:revs.length,nNew:news.length,sid:rid(6),book:p.book};
  question();
}

function saveAcct(){if(acct)lsSet(ACCTKEY,acct);else{try{localStorage.removeItem(ACCTKEY)}catch(e){}}}
async function api(a,payload){
  if(!COLLECT_URL)return {ok:false,err:'disabled'};
  let res;
  try{res=await fetch(COLLECT_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({a},payload))})}
  catch(e){return {ok:false,err:'network'}}
  try{return await res.json()}catch(e){return {ok:false,err:'bad_response'}}
}
async function pwKey(name,pw){
  const subtle=(typeof crypto!=='undefined'&&crypto.subtle);
  if(!subtle)throw new Error('nocrypto');
  const enc=new TextEncoder();
  const key=await subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveBits']);
  const bits=await subtle.deriveBits({name:'PBKDF2',salt:enc.encode('eitango-kakitori|'+name.toLowerCase()),iterations:100000,hash:'SHA-256'},key,256);
  return Array.from(new Uint8Array(bits)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
const AUTHERR={
  name_taken:'そのニックネームはすでに使われています。',
  bad_login:'ニックネームまたはパスワードが違います。',
  too_many:'失敗が続いたため、しばらく(10分ほど)ログインできません。',
  bad_name:'ニックネームは2〜16文字で、文字・数字・_ - が使えます。',
  bad_pw:'パスワードの形式が正しくありません。',
  network:'通信できませんでした。電波の状態を確認して、もう一度試してください。',
  server:'サーバーでエラーが出ました。時間をおいて試してください。',
  disabled:'このページではログインを使えません。',
  unknown_action:'サーバーのスクリプトが古いようです(作成者に更新を依頼してください)。',
  bad_token:'ログインの有効期限が切れました。もう一度ログインしてください。',
  bad_response:'サーバーの返答を読み取れませんでした。Apps Script を最新のコード(v2)に更新して、「新バージョン」でデプロイしたか確認してください。',
};
async function doAuth(kind,name,pw,wantConsent){
  name=String(name||'').trim();
  if(!/^[0-9A-Za-zぁ-んァ-ヶー一-龠_\-]{2,16}$/.test(name))return {ok:false,msg:AUTHERR.bad_name};
  if(String(pw||'').length<8)return {ok:false,msg:'パスワードは8文字以上にしてください。'};
  if(learner.consent!==true&&!wantConsent)return {ok:false,msg:'ランキングに参加するには、学習データの記録への同意が必要です。'};
  let key;
  try{key=await pwKey(name,pw)}catch(e){return {ok:false,msg:'このブラウザではログインを使えません(https:// のページで開いてください)。'}}
  const r=await api(kind,{name,pw:key});
  if(!r||!r.ok)return {ok:false,msg:AUTHERR[r&&r.err]||('ログインできませんでした。'+(r&&r.err?`(${r.err})`:''))};
  acct={id:r.acct,name:r.name,tok:r.tok,exp:r.exp};saveAcct();
  if(learner.consent!==true){learner.consent=true;saveLearner()}
  flushUpload();
  return {ok:true};
}
async function doLogout(){
  if(acct&&acct.tok&&!acct.expired)await api('logout',{tok:acct.tok,acct:acct.id});
  acct=null;saveAcct();
}
async function doDeleteAccount(){
  if(acct&&acct.tok){const r=await api('delete',{tok:acct.tok,acct:acct.id});if(!r.ok&&r.err!=='bad_token')return r}
  acct=null;saveAcct();return {ok:true};
}

    }else{
      const need=learner.consent!==true;
      ov.innerHTML=`<div class="sheet"><div class="sheethead"><h2>ログイン</h2><button type="button" class="btn" id="ovclose">閉じる</button></div>
        ${acct&&acct.expired?'<p class="note" style="color:var(--red)">ログインの有効期限が切れました。もう一度ログインしてください。</p>':''}
        <div class="seg" id="seg-auth"><button type="button" data-m="login" aria-pressed="${mode==='login'}">ログイン</button><button type="button" data-m="register" aria-pressed="${mode==='register'}">新規登録</button></div>
        <label class="thrf" style="margin-top:12px">ニックネーム(ランキングに表示されます。本名は使わないでください)<input type="text" id="a-name" maxlength="16" autocomplete="username" spellcheck="false" value="${esc(acct?acct.name:'')}"></label>

        ${need?'<label class="check" style="margin-top:8px"><input type="checkbox" id="a-consent"> 学習データの記録に同意する(ランキングに必要)</label>':''}
        <p class="note" id="a-msg" role="status"></p>
        <button type="button" class="btn primary start" id="a-go" style="margin-top:8px">${mode==='login'?'ログイン':'登録してログイン'}</button>
        <p class="note" style="margin-top:10px">パスワードは、この端末で変換してから送信し、サーバーには元のパスワードを保存しません。ただし、他のサービスと同じパスワードは使わないでください。</p></div>`;
      $('#seg-auth').addEventListener('click',e=>{const x=e.target.closest('button');if(!x)return;mode=x.dataset.m;render()});
      const go=async()=>{
        const btn=$('#a-go');btn.disabled=true;msg('通信中…');
        const cb=document.getElementById('a-consent');
        const r=await doAuth(mode,$('#a-name').value,$('#a-pw').value,!!(cb&&cb.checked));
        btn.disabled=false;
        if(!r.ok){msg(r.msg);return}

      $('#a-go').onclick=go;
      $('#a-pw').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.isComposing&&e.keyCode!==229){e.preventDefault();go()}});
    }

    ov.onclick=e=>{if(e.target===ov)closeSettings()};
  };

  ov.hidden=false;document.body.style.overflow='hidden';
  const f=document.getElementById('a-name')||document.getElementById('ovclose');if(f&&f.focus)f.focus();
}

async function loadRank(){
  const body=()=>document.getElementById('rk-body');
  if(body())body().innerHTML='<p class="note">読み込み中…</p>';
  await flushUpload();
  const r=await api('rank',{tok:acct.tok,acct:acct.id});
  if(!body())return;
  if(!r.ok){
    if(r.err==='bad_token'){acct.expired=true;saveAcct();home();return}
    body().innerHTML=`<p class="note" style="color:var(--red)">${esc(AUTHERR[r.err]||'ランキングを読み込めませんでした。')}</p>`;return;
  }
  rankData=r;renderRank();
}
function renderRank(){
  const el=document.getElementById('rk-body');if(!el||!rankData)return;
  const L=rankData.lists[rankSel],label=rankSel==='cur'?monthLabel(rankData.cur):rankSel==='prev'?monthLabel(rankData.prev):'通算';

  const rows=L.top.map(r=>`<tr${r.me?' class="me"':''}><td>${r.rank}</td><td>${esc(r.name)}${r.me?'(あなた)':''}</td><td>${f(r.score)}</td></tr>`).join('');

  el.innerHTML=`<p class="note" style="margin:0 0 6px">${label}のランキング(参加 ${L.n}人)</p>
    <div class="scroll"><table class="rank"><tr><th>順位</th><th>ニックネーム</th><th>スコア</th></tr>${rows||'<tr><td colspan="3">まだ記録がありません</td></tr>'}</table></div>

      <div class="stat"><span class="k">完全定着した単語</span><span class="v">${b.mast}<small>語</small></span><span class="s">+${f(b.pMast)}</span></div>

function testPool(scope){
  const out=[];
  for(const b of (scope==='all'?BOOKS:[curBook()]))for(const w of b.words){
    const s=srs.words[b.id+'|'+w[1]];
    if(s&&s.r>=1&&(s.done||(s.iv||0)>=CONSOL_DAYS))out.push({b,w});
  }
  return out;
}
function startTest(){
  let items=shuffle(testPool(cfg.testScope));
  if(cfg.testN)items=items.slice(0,cfg.testN);
  const queue=items.map(({b,w})=>mkEntry(b,w,'test',false));
  if(!queue.length){home();return}
  S={mode:'test',queue,i:0,phase:'answer',answers:[],total:queue.length,doneCount:0,sid:rid(6)};

}

const JP_PART='をにがのとでへ';
function jaForms(s){
  const t=s.normalize('NFKC').replace(/\s/g,'').replace(/[~〜]/g,'');
  const out=[t]; if(t.length>1&&JP_PART.includes(t[0]))out.push(t.slice(1));
  return out.filter(Boolean);
}
function jaChunks(ja){
  const t=ja.normalize('NFKC').replace(/〔[^〕]*〕/g,'').replace(/\([^)]*\)/g,'').replace(/\[[^\]]*\]/g,'');
  return t.split(/[、,;，\/]/).map(x=>x.trim()).filter(Boolean);
}
function localMatchJa(typed,ja){
  const model=jaChunks(ja).map(jaForms);
  return jaChunks(typed).some(tc=>{const tf=jaForms(tc);return model.some(cf=>cf.some(x=>tf.includes(x)))});
}

  const code=err&&err.code;
  if(code==='cancelled')return 'AI判定をキャンセルしたため、不正解扱いにしました。';
  const det=[code,err&&err.status?'HTTP '+err.status:'',err&&err.detail?String(err.detail).slice(0,80):''].filter(Boolean).join(' / ');
  return `${AIERR[code]||'AI判定に失敗したため、模範解答との一致だけで判定しました。'}(${beLabel(be)}: ${det||'原因不明'})`;
}
function parseLoose(t){
  try{return JSON.parse(t)}catch(e){}
  const m=String(t).match(/\{[\s\S]*\}/); if(m){try{return JSON.parse(m[0])}catch(e){}}
  return null;
}
function parseVerdict(t){
  const j=parseLoose(t);
  if(j&&typeof j.correct==='boolean')return {correct:j.correct,reason:String(j.reason||'').slice(0,60)};
  const m=String(t).match(/"correct"\s*:\s*(true|false)/i);   // 途中で切れた返答でも、判定だけは読み取る
  if(m){const r=String(t).match(/"reason"\s*:\s*"([^"]*)/);return {correct:m[1].toLowerCase()==='true',reason:r?r[1].slice(0,60):''}}
  return null;
}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function keyCall(prompt,signal){
  for(let attempt=0;attempt<2;attempt++){
    let res;
    try{
      res=await fetch('https://api.anthropic.com/v1/messages',{
        method:'POST',signal,
        headers:{'content-type':'application/json','x-api-key':aiCfg.key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
        body:JSON.stringify({model:aiCfg.model||DEFAULT_MODEL,max_tokens:600,messages:[{role:'user',content:prompt}]}),
      });
    }catch(err){
      if(err&&err.name==='AbortError')throw {code:'cancelled'};
      if(attempt===0){await sleep(800);continue}
      throw {code:'network'};
    }
    if(!res.ok){
      if(res.status>=500&&attempt===0){await sleep(800);continue}
      let detail='';try{const j=await res.json();detail=(j&&j.error&&j.error.message)||''}catch(e){}
      const code=res.status===401||res.status===403?'invalid_key':res.status===404?'model_not_found':res.status===429?'rate_limited':res.status===400?'bad_request':'upstream_error';
      throw {code,status:res.status,detail};
    }
    const data=await res.json();
    return (data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('');
  }
}
async function aiJudge(en,ja,answer,signal,be){
  const prompt=`英単語(または熟語)の日本語訳を答える問題の採点をしてください。

英語: ${JSON.stringify(en)}
模範解答(複数の意味は「、」「；」で区切られています): ${JSON.stringify(ja)}
学習者の答え: ${JSON.stringify(answer.slice(0,200))}

採点基準:
- 学習者の答えが、模範解答のどれかの意味と同じ、または自然な同義語・言い換えで、その英語の訳として通用するなら正解(correct: true)。
- ひらがな/カタカナ/漢字の表記の違い、送り仮名、助詞(を・に・が など)の有無、「～」の有無、「する」などの語尾の違いは気にしない。
- 少し言葉が違っても、ニュアンスが合っていれば正解にする。
- 意味が違う、別の語の意味、反対の意味、または意味の一部だけで誤解を招く答えは不正解。

出力は、{ で始まり } で終わるJSONだけにしてください。前置き、説明、コードブロックは書かないでください。
{"correct": true か false, "reason": "20字以内の日本語の理由"}`;
  let text,r;
  if((be||aiBackend())==='sample'){
    r=await sampleFn.json(prompt,{modelTier:'quick',signal});
    if(!r||typeof r.correct!=='boolean')throw {code:'invalid_json'};
    return {correct:r.correct,reason:String(r.reason||'').slice(0,60)};
  }
  text=await keyCall(prompt,signal);
  r=parseVerdict(text);
  if(!r)throw {code:'invalid_json',detail:String(text).slice(0,60)};
  return r;
}

/* ---------- Quiz ---------- */
function question(){
  const e=S.queue[S.i];
  const [no,en,ja]=e.item;
  S.phase='answer';S.last=null;
  const ej=cfg.dir==='ej';
  const srsMode=S.mode==='srs';
  const pct=Math.round((srsMode?S.doneCount:S.i)/S.total*100);
  const tag=S.mode==='test'?'確認テスト':!srsMode?'':e.loop?(e.kind==='rev'?'やり直し':'もう一度'):(e.kind==='new'?'新規':'復習');
  $('#app').innerHTML=`
    <div class="topbar"><button class="btn ghost" id="quit">やめる</button><span class="pos">${srsMode?`${S.doneCount} / ${S.total} 語完了`:`${S.i+1} / ${S.total}`}</span></div>
    <div class="meter"><i style="width:${pct}%"></i></div>
    <section class="paper card">
      <p class="no">${esc(e.book.name)}　No.${esc(no)}${tag?`<span class="tag">${tag}</span>`:''}</p>
      ${ej?`<h2 class="eword">${esc(en)}</h2>`:`<h2 class="meaning">${esc(maskMeaning(ja,en))}</h2>`}
      <input class="answer${ej?' ja':''}" id="ans" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" lang="${ej?'ja':'en'}" inputmode="text" aria-label="${ej?'日本語で意味を答える':'英語で答える'}"${ej?' placeholder="日本語で意味を入力"':''}>
      <div class="fb" id="fb" aria-live="polite"></div>
      <div class="actions" id="actions">
        <button class="btn" id="giveup">わからない</button>
        <button class="btn primary" id="check">答え合わせ</button>
      </div>
      <p class="kbd" id="kbd">Enter で答え合わせ</p>
    </section>`;
  $('#quit').onclick=home;
  $('#giveup').onclick=()=>judge(true);
  $('#check').onclick=()=>judge(false);
  $('#ans').focus();
  S.t0=performance.now();
}
function maskMeaning(ja,en){
  let o=ja;
  for(const v of variants(en)){
    const w=v.replace(/[^A-Za-z' -]/g,'').trim(); if(w.length<3)continue;
    o=o.replace(new RegExp('\\b'+w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&').replace(/\s+/g,'\\s+')+'\\b','gi'),'＿＿＿');
  }
  return o;
}
function diffTyped(typed,ans){
  let o='';for(let k=0;k<typed.length;k++){const c=esc(typed[k]);o+=(ans[k]!==undefined&&fold(typed[k])===fold(ans[k]))?c:`<span class="wrong">${c}</span>`}
  return o;
}
function bestVariant(typed,en){
  const vs=variants(en).map(v=>v.toLowerCase());
  let best=vs[0],bl=-1;
  for(const v of vs){let k=0;while(k<typed.length&&k<v.length&&fold(typed[k])===fold(v[k]))k++;if(k>bl){bl=k;best=v}}
  return best;
}
function judge(giveup){
  if(S.phase!=='answer')return;
  const e=S.queue[S.i], en=e.item[1];
  const raw=$('#ans').value;
  if(!giveup&&!raw.trim()){$('#ans').focus();return}
  const sec=(performance.now()-S.t0)/1000;   // AI判定を待つ時間は含めない
  $('#ans').disabled=true;
  if(cfg.dir==='ej')return judgeEj(e,raw.trim(),giveup,sec);
  const typed=norm(raw);
  const mv=giveup?null:variants(en).find(v=>fold(v)===fold(typed));
  finalize(e,{ok:!!mv,giveup,raw,sec,v:mv});
}
async function judgeEj(e,typed,giveup,sec){
  const [no,en,ja]=e.item;
  if(giveup){finalize(e,{ok:false,giveup:true,raw:'',sec});return}
  if(localMatchJa(typed,ja)){finalize(e,{ok:true,raw:typed,sec});return}
  const be=aiBackend();
  if(!be){finalize(e,{ok:false,raw:typed,sec,note:'AI判定が使えないため、模範解答との一致だけで判定しました。'});return}
  S.phase='judging';
  const ctl=new AbortController(); S.ctl=ctl;
  $('#fb').className='fb';
  $('#fb').innerHTML=`<div class="verdict">AI判定中…</div><p class="next">模範解答と違うため、意味が合っているかをAIが確認しています(${beLabel(be)})。</p>`;
  $('#actions').innerHTML='<button class="btn" id="aicancel">待たずに進む(不正解扱い)</button>';
  $('#kbd').textContent='';
  $('#aicancel').onclick=()=>ctl.abort();
  let verdict=null,failure=null;
  try{verdict=await aiJudge(en,ja,typed,ctl.signal,be)}catch(err){failure=err||{code:'unknown'}}
  if(!S||S.phase!=='judging'||S.queue[S.i]!==e)return;
  if(verdict){
    finalize(e,{ok:verdict.correct,ai:1,raw:typed,sec,note:`AI判定(${beLabel(be)}): ${verdict.correct?'意味が合っています':'意味が違います'}${verdict.reason?`(${verdict.reason})`:''}`});
    return;
  }
  const code=failure.code;
  try{console.warn('AI判定エラー',be,code,failure.status,failure.detail)}catch(x){}
  if(be==='sample'&&AI_OFF.includes(code))sampleBlocked=true;
  if(be==='key'){if(KEY_OFF.includes(code))keyBlocked=true;else if(code==='network')keyRetryAt=Date.now()+60000}
  refreshAiState();
  finalize(e,{ok:false,raw:typed,sec,note:aiErrNote(failure,be)});
}
function takeSnap(e){
  const en=e.item[1], cl=o=>o?JSON.parse(JSON.stringify(o)):null;
  return {k:e.key,st:cl(srs.words[e.key]),e:{loop:e.loop,cons:e.cons,done:e.done,requeue:e.requeue},dc:S.doneCount,ms:S.mastered?S.mastered.length:0,stat:cl(stats[en])};
}
function undoLast(L){
  const {snap,e,insIdx}=L, en=e.item[1];
  if(L.evq)removeEvent(L.evq);
  if(insIdx!==null)S.queue.splice(insIdx,1);
  if(snap.st)srs.words[snap.k]=snap.st; else delete srs.words[snap.k];
  if(snap.stat)stats[en]=snap.stat; else delete stats[en];
  Object.assign(e,snap.e);
  S.doneCount=snap.dc; if(S.mastered)S.mastered.length=snap.ms;
  S.answers.pop(); saveSrs(); saveStats();
}
function overrideCorrect(){
  if(S.phase!=='feedback'||!S.last)return;
  const L=S.last; undoLast(L);
  finalize(L.e,Object.assign({},L.r,{ok:true,giveup:false,overridden:true,note:'自己判定で正解にしました。'}));
}
function finalize(e,r){
  const [no,en,ja]=e.item;
  const ej=cfg.dir==='ej';
  S.phase='feedback'; S.ctl=null;
  $('#ans').disabled=true;
  const snap=takeSnap(e);
  const v=ej?jaLen(r.raw||''):r.v;   // 英日は、回答した日本語の文字数で判定
  let g,msg='',meta='',insIdx=null;
  if(S.mode==='srs'){
    g=gradeOf(r.ok,r.sec,v);
    msg=applySrs(e,g);
    if(e.requeue){const idx=Math.min(S.i+1+e.requeue,S.queue.length);S.queue.splice(idx,0,e);insIdx=idx}
    if(r.ok){const t=thresholds(v);meta=`${r.sec.toFixed(1)}秒(定着 ${t.S.toFixed(1)}秒 / 正解 ${t.A.toFixed(1)}秒 以内)`}
  }else if(S.mode==='test'){
    g=gradeOf(r.ok,r.sec,v);
    if(r.ok)meta=`${r.sec.toFixed(1)}秒`;
  }else{
    g=r.ok?'A':'X';
    const st=stats[en]||{c:0,m:0,s:0};
    if(r.ok){st.c++;st.s++}else{st.m++;st.s=0}
    stats[en]=st;saveStats();
    if(r.ok)e.done=true;
  }
  S.answers.push({e,en,ja,g,sec:r.sec,ok:r.ok});
  S.last={e,snap,insIdx,r,evq:null};
  {
    const pre=snap.st,post=srs.words[e.key],srsM=S.mode==='srs';
    S.last.evq=logEvent({t:Date.now(),ss:S.sid,d:cfg.dir,b:e.book.id,n:+no||0,w:en,
      m:srsM?'s':S.mode==='test'?'t':'f',
      k:e.kind==='new'?'n':e.kind==='rev'?'r':e.kind==='test'?'t':'f',
      lp:snap.e.loop?1:0,g,ok:r.ok?1:0,s:Math.round(r.sec*10)/10,
      gp:(pre&&pre.last!==undefined&&pre.last!==null)?today()-pre.last:null,
      r0:pre?(pre.r||0):0,
      iv:srsM?((post&&post.iv!==undefined)?post.iv:null):((pre&&pre.iv!==undefined)?pre.iv:null),
      dn:srsM?((post&&post.done)?1:0):((pre&&pre.done)?1:0),
      ai:r.ai?1:0,ov:r.overridden?1:0,ct:isCustomThr()?1:0});
  }
  const cls=g==='H'?'hard':r.ok?'good':'bad';
  let head;
  if(S.mode==='srs')head=r.ok?`<span class="${g==='H'?'hd':'ok'}">${GLABEL[g]}</span>`:`<span class="ng">${r.giveup?'答え':'不正解'}</span>`;
  else head=r.ok?`<span class="ok">正解</span>`:`<span class="ng">${r.giveup?'答え':'不正解'}</span>`;
  let typedLine='';
  if(!r.ok&&!r.giveup&&r.raw){
    typedLine=ej?`<div class="typed typed-ja"><s>${esc(r.raw)}</s></div>`
      :`<div class="typed"><s>${diffTyped(norm(r.raw),bestVariant(norm(r.raw),en))}</s></div>`;
  }
  const correctLine=ej?`<div class="correct ja">${esc(ja)}</div>`:`<div class="correct">${esc(en)}</div>`;
  const fb=$('#fb');
  fb.className='fb '+cls;
  fb.innerHTML=`<div class="verdict">${head}${meta?`<span class="meta">${meta}</span>`:''}</div>${typedLine}${correctLine}${r.note?`<p class="next">${esc(r.note)}</p>`:''}${msg?`<p class="next">${esc(msg)}</p>`:''}`;
  const last=S.i>=S.queue.length-1;
  const canOverride=ej&&!r.ok&&!r.giveup&&!r.overridden;
  $('#actions').innerHTML=`${canOverride?'<button class="btn" id="override">正解として扱う</button>':''}<button class="btn primary" id="next">${last?'結果を見る':'次へ'}</button>`;
  $('#next').onclick=next;
  if(canOverride)$('#override').onclick=overrideCorrect;
  $('#kbd').textContent='Enter で次へ';
}
function next(){
  if(S.phase!=='feedback')return;
  S.i++; if(S.i>=S.queue.length)result(); else question();
}
document.addEventListener('keydown',e=>{
  if(!S||e.key!=='Enter'||e.isComposing||e.keyCode===229)return;
  if(S.phase==='answer'){e.preventDefault();judge(false)}
  else if(S.phase==='feedback'){e.preventDefault();next()}
});

/* ---------- Result ---------- */
function result(){
  S.phase='result';
  S.mode==='srs'?resultSrs():S.mode==='test'?resultTest():resultFree();
  flushUpload();
  window.scrollTo(0,0);
}
function resultSrs(){
  const a=S.answers, c={S:0,A:0,H:0,X:0};
  a.forEach(x=>c[x.g]++);
  const worst={};
  for(const x of a){if(x.g==='H'||x.g==='X'){const w=worst[x.e.key];if(!w||x.g==='X')worst[x.e.key]=x}}
  const weak=Object.values(worst);
  const t=today();
  let tomorrow=0,carry=0;
  for(const k in srs.words){if(S.book&&!k.startsWith(S.book.id+'|'))continue;const s=srs.words[k];if(s.done||s.due===null||s.due===undefined)continue;if(s.due===t+1)tomorrow++;else if(s.due<=t&&INDEX.has(k))carry++}
  const box=(k,l)=>`<div class="stat"><span class="k">${l}</span><span class="v">${c[k]}</span></div>`;
  $('#app').innerHTML=`
    <h1 class="title">今日の結果</h1>
    <section class="paper" style="margin-top:14px">
      <div class="score">${S.total}<small> 語を学習(新規 ${S.nNew}・復習 ${S.nRev})</small></div>
      <p class="note">回答 ${a.length}回</p>
      <div class="counts">${box('S','定着')}${box('A','正解')}${box('H','難しい')}${box('X','不正解')}</div>
      ${S.mastered.length?`<p class="note" style="margin-top:14px">完全定着 ${S.mastered.length}語</p>
        <ul class="list">${S.mastered.map(e=>`<li><b>${esc(e.item[1])}</b><span>${esc(e.item[2])}</span></li>`).join('')}</ul>`:''}
      ${weak.length?`<p class="note" style="margin-top:14px">難しかった・間違えた単語</p>
        <ul class="list">${weak.map(x=>`<li><b>${esc(x.en)}</b><span>${esc(x.ja)}　[${GLABEL[x.g]}]</span></li>`).join('')}</ul>`:''}
      <p class="note" style="margin-top:14px">明日の復習予定(この単語帳): ${tomorrow}語${carry?`　／　持ち越し: ${carry}語`:''}</p>
      <div class="stack"><button class="btn primary" id="back">トップに戻る</button></div>
    </section>`;
  $('#back').onclick=home;
}
function resultFree(){
  const total=S.answers.length, okN=S.answers.filter(r=>r.ok).length;
  const miss=S.answers.filter(r=>!r.ok);
  const pct=Math.round(okN/total*100);
  const book=S.book;
  $('#app').innerHTML=`
    <h1 class="title">結果</h1>
    <section class="paper" style="margin-top:14px">
      <p class="note">${esc(book.name)}・自由練習</p>
      <div class="score">${okN}<small> / ${total} 問正解(${pct}%)</small></div>
      ${miss.length?`<p class="note" style="margin-top:14px">間違えた単語</p>
      <ul class="list">${miss.map(r=>`<li><b>${esc(r.en)}</b><span>${esc(r.ja)}</span></li>`).join('')}</ul>`
      :`<p style="margin-top:14px">全問正解です。</p>`}
      <div class="stack">
        ${miss.length?'<button class="btn primary" id="retry">間違えた単語をもう一度</button>':''}
        <button class="btn" id="again">同じ設定でもう一度</button>
        <button class="btn" id="back">トップに戻る</button>
      </div>
    </section>`;
  if(miss.length)$('#retry').onclick=()=>startFree(shuffle(miss.map(r=>mkEntry(r.e.book,r.e.item,'free',false))));
  $('#again').onclick=()=>{cfg.book=book.id;startFree(makeFree())};
  $('#back').onclick=home;
}
home();
</script>
